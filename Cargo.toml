[package]
name = "raccolta_dati"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
chrono = "0.4.45"
# wgpu (default, DirectX 12) plus glow (OpenGL) as a fallback graphics mode: on some
# work PCs one graphics driver hangs while the window opens (main.rs, watchdog).
eframe = { version = "0.37.0", features = ["glow"] }
egui_extras = "0.37.0"
# Phosphor icon set (MIT) for egui 0.37 (maintained fork of egui-phosphor; the
# upstream crate still targets egui 0.36). Only the font files and icon names.
egui_phosphor = { package = "egui-pop-phosphor", version = "0.15.0", default-features = false, features = ["regular", "fill"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rust_decimal = "1.43.0"
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "native-tls", "rust_decimal", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["compat"] }

# Craft Anything usually runs the debug build: keep libraries optimised so the
# window and the database driver stay fast.
[profile.dev]
opt-level = 1
# No debug info in the program file: with it the exe was ~440 MB, and Windows Defender
# scanning a fresh 440 MB build made the first launches look like they did nothing.
debug = false
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
debug = false
